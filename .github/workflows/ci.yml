name: CI

on:
  push:
    branches: ["master", "release/**", "fix/**", "feature/**", "hotfix/**"]
  pull_request:
    branches: ["master"]

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/heads/hotfix/') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/fix/')
    steps:
      - uses: actions/checkout@v4
      - name: Check all version files agree
        run: |
          PY=$(grep '^version' backend/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          PKG=$(node -p "require('./plugin/package.json').version")
          MAN=$(node -p "require('./plugin/manifest.json').version")
          echo "pyproject: $PY  package.json: $PKG  manifest.json: $MAN"
          if [ "$PY" != "$PKG" ] || [ "$PKG" != "$MAN" ]; then
            echo "❌ Version mismatch — bump all three files to the same version before merging."
            exit 1
          fi
          echo "✓ All versions agree: $PY"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Keep the uv project environment OUT of backend/ (repo policy: the backend
    # venv lives at the repo root, never backend/.venv). Without this, `uv sync`
    # run from ./backend would create backend/.venv.
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --extra dev --extra mcp

      - name: Run ruff
        working-directory: ./backend
        run: uv run ruff check src/

      - name: Run pytest
        working-directory: ./backend
        run: uv run pytest -q

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Stub build manifest
        run: |
          mkdir -p plugin/src/generated
          echo '{"schema":1,"git_commit":"ci","git_dirty":false,"backend_version":"0.0.0","plugin_version":"0.0.0"}' > plugin/src/generated/buildManifest.json

      - name: Run TypeScript check
        working-directory: ./plugin
        run: npx tsc --noEmit

      - name: Run vitest
        working-directory: ./plugin
        run: npx vitest run
