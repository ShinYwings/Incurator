name: CI

on:
  push:
    branches: ["master", "release/**", "fix/**", "feat/**", "feature/**", "hotfix/**", "chore/**"]
  pull_request:
    branches: ["master"]

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    # No branch condition. The previous one tested `github.ref` against
    # `refs/heads/*`, but on a pull_request event github.ref is
    # `refs/pull/<n>/merge` — so the gate never once ran on a pull request, and
    # it also skipped any branch prefix missing from the allowlist (`feat/**`
    # was). v0.53.2 shipped with pyproject at 0.53.1 and the plugin at 0.53.2
    # straight through it. The check costs five seconds; run it every time.
    steps:
      - uses: actions/checkout@v4
      - name: Check all version files agree
        run: |
          PY=$(grep '^version' backend/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          PKG=$(node -p "require('./plugin/package.json').version")
          MAN=$(node -p "require('./plugin/manifest.json').version")
          # npm stores the version twice in a lockfile; `npm install` rewrites
          # both from package.json, so a bump that skips the lockfile surfaces
          # later as a surprise diff from any unrelated npm invocation.
          LOCK=$(node -p "require('./plugin/package-lock.json').version")
          LOCK_ROOT=$(node -p "require('./plugin/package-lock.json').packages[''].version")
          echo "pyproject: $PY  package.json: $PKG  manifest.json: $MAN  package-lock.json: $LOCK/$LOCK_ROOT"
          if [ "$PY" != "$PKG" ] || [ "$PKG" != "$MAN" ] || [ "$MAN" != "$LOCK" ] || [ "$LOCK" != "$LOCK_ROOT" ]; then
            echo "❌ Version mismatch — bump all version files to the same version before merging."
            echo "   Files: backend/pyproject.toml, plugin/package.json, plugin/manifest.json, plugin/package-lock.json"
            exit 1
          fi
          echo "✓ All versions agree: $PY"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv venv .venv-dev
          uv pip install --python .venv-dev/bin/python -e './backend[dev,mcp]'

      - name: Run ruff
        run: scripts/backend-check ruff

      - name: Run mypy
        run: scripts/backend-check mypy

      - name: Run pytest
        run: scripts/backend-check pytest

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Stub build manifest
        run: |
          mkdir -p plugin/src/generated
          echo '{"schema":1,"git_commit":"ci","git_dirty":false,"backend_version":"0.0.0","plugin_version":"0.0.0"}' > plugin/src/generated/buildManifest.json

      - name: Run TypeScript check
        working-directory: ./plugin
        run: npx tsc --noEmit

      - name: Run vitest
        working-directory: ./plugin
        run: npx vitest run
