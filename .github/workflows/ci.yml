name: CI

on:
  push:
    branches: ["master", "release/**", "fix/**", "feature/**", "hotfix/**"]
  pull_request:
    branches: ["master"]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        run: cd backend && uv sync --extra dev --extra mcp

      - name: Run ruff
        run: cd backend && uv run ruff check src/

      - name: Run pytest
        run: cd backend && uv run pytest -q

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        run: cd plugin && npm ci

      - name: Run TypeScript check
        run: cd plugin && npx tsc --noEmit

      - name: Run vitest
        run: cd plugin && npx vitest run
