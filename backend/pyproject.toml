[project]
name = "incurator"
version = "0.72.0"
description = "An LLM-maintained personal wiki, per Karpathy's pattern. Local-first, enterprise-grade."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Incurator" }
]
license = { text = "MIT" }
dependencies = [
    # Stage 1
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    # Stage 2 — parsers
    "onnxruntime<1.24.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Stage 3 — LLM ingest
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pydantic>=2.6.0",
    "hatchling>=1.21.0",
    "scikit-learn>=1.4.0",
    # Stage 4 — v0.3.2 DB-native search (brute-force vector cosine)
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# MCP server: lets workspace agents (Claude Code, Antigravity, etc.) query the
# Curator DAG natively. Install with:
# MCP 2.x removed the mcp.server.fastmcp API used by this runtime; stay on 1.x
# until the server is deliberately migrated to the new major-version contract.
mcp = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "mcp>=1.0.0,<2",
]
# Local search GGUF runtime: Qwen3 embedding + reranker via llama-cpp-python.
# Install with: uv pip install -e './backend[rerank]' (or run ./setup.sh
# from the repository root). GGUF files are provisioned by `wiki models ensure`.
# Without it search degrades to FTS5/RRF / `no_rerank`.
rerank = [
    "llama-cpp-python>=0.3.0",
]

[tool.uv]
# The backend package is intentionally unmanaged by uv so validation never asks
# uv to create `backend/.venv` or `backend/uv.lock`. Use repo-root `.venv` for
# service/runtime (`./setup.sh`) and repo-root `.venv-dev` for local validation
# via `scripts/backend-check`.
managed = false

[project.scripts]
wiki = "curator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/curator"]

[tool.pytest.ini_options]
cache_dir = "../.cache/pytest"

[tool.ruff]
cache-dir = "../.cache/ruff"

[tool.ruff.lint]
# Keep the repository's established lint contract stable across Ruff releases.
# Ruff 0.16 expanded its implicit defaults, so relying on defaults made a fresh
# CI environment report hundreds of unrelated historical diagnostics.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
mypy_path = "stubs"
cache_dir = "../.cache/mypy"
