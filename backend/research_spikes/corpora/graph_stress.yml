    partition: adversarial
    family: direct-factual
    text: jaguar predator habitat
    expected: [N09, N11]
    hard_negatives: [N10, N12]
  - id: GQ06
    partition: adversarial
    family: direct-factual
    text: jaguar e-type engine
    expected: [N10, N12]
    hard_negatives: [N09, N11]
  - id: GQ07
    partition: holdout
