version: 1
wave: C
recorded_at: "2026-06-12"
hypotheses:
  - Complexity-aware routing matches the correct route more often than always-local or always-most-complex while avoiding the highest token cost.
  - A retrieval sufficiency gate beats one-shot task success at a lower correction rate than always-correct, but its recall is bounded by evaluator blind spots.
  - Bounded iterative retrieval completes multi-step tasks one-shot cannot, stays within 1 + max_followups retrievals, and never mixes snapshots.
  - Progressive disclosure recovers every omitted relevant item through stable handles, unlike a silent fixed character block or fixed top-k.
