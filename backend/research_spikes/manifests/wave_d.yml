version: 1
wave: D
recorded_at: "2026-06-12"
hypotheses:
  - Current extraction recovers text-layer formulas that parser-only output loses, but downstream distillation can still remove formulas already present in extraction.
  - Confidence-gated selective recovery improves formula recall on proven-loss regions without overwriting raw evidence or accepting an ambiguous wrong candidate.
  - Page-hash-bound recovery invalidates stale output on a changed source page and avoids reprocessing an unchanged formula page.
  - Whole-corpus heavy recovery costs materially more than recovery limited to proven-loss pages.
metric_semantics:
  formula_recall: Set-based unique formula labels per fixture; duplicate occurrences do not change the denominator.
  stale_recovery_served: Compares the independently simulated served page hash after refresh success/failure with the updated source-page hash.
