# [CRITICAL WARNING] DO NOT ADD LOCAL WORKSPACE FILES (e.g., 01_Workspaces/**, Papers/, *.md) TO sources.include.
# ALL sources MUST be relative to the global vault_root defined in AGENTS.md.
# curate.yml — Knowledge Requirement Specification
# Generated by: wiki workspace init
#
# The Curator reads this file to scope dynamic curation for this workspace.
# curator_query/search_curator MCP tools apply these filters automatically when
# WORKSPACE_PATH env var points to this directory.

project: "{{project_name}}"
description: "{{description}}"
vault_root: "{{vault_root}}"

persona:
  domain: ""
  subdomain: ""
  goal: ""
  output_intent: "engineer"       # researcher | engineer | learner
  disambiguation_keywords: []
  confidence:                     # Override global thresholds for this workspace.
    high_threshold: 0.85          # Evidence above this -> high confidence.
    low_threshold: 0.55           # Evidence below this -> HITL review.
  updated_at: ""

# Source selection: which vault files to pull knowledge from.
# Patterns are fnmatch globs relative to the vault root.
# Empty include list = include all sources (no filter).
# This is the primary filter used by workspace queries to select evidence.
sources:
  include: []
  #  - "03_Notes/**"
  #  - "02_Wiki/ml/**"
  exclude: []
  #  - "03_Notes/private/**"



# Minimum confidence_score for surfaced evidence.
# Evidence below this threshold is excluded from curation/search results.
# Range: 0.0 - 1.0. Default: 0.60
min_confidence: 0.60
