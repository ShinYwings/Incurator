      `db/jobs.py`, and `db/sources.py`. The new table is written only by graph
      extraction and read only on resume; at the time of the holdout it does not
      exist and no code path consults it. It is absent from `SYNC_TABLES`, so the
      export format is unchanged, and absent from the search projection, so
      `materialize_search_documents` and the FTS5 corpus are byte-identical.

