      files the holdout actually exercises -- `failure_atlas_holdout.py`,
      `retrieval/evaluation.py`, `retrieval/engine.py`, `retrieval/lexical.py`,
      `retrieval/fusion.py`, `retrieval/embedding.py`, `retrieval/chunking.py` --
