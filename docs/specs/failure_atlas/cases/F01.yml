id: F1
title: Search-hit provenance dropped at EngineHit→SearchHit conversion and evidence assembly
query_family: direct-factual
execution_mode: deterministic
status: retired
status_history:
  - date: "2026-06-11"
    status: suspected
    evidence: "Umbrella plan §4 (.agents/plans/03_rag_knowledge_quality_stabilization.md), Arena consensus"
  - date: "2026-06-12"
    status: reproduced
    evidence: "backend/tests/test_failure_atlas_repro.py::test_f1_baseline_search_hit_items_drop_source_span_ids"
  - date: "2026-06-12"
    status: assigned
