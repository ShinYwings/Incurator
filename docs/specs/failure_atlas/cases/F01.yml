    adapter repair P5 is allowed to make.
resolution:
  version: 0.7.0
  evidence: backend/tests/test_failure_atlas_repro.py::test_f1_search_hit_items_carry_source_span_ids
  after_state: >
    SearchHit and search-derived EvidenceItem preserve hydrated source_span_ids;
    the EvidencePack unions those spans into its authoritative provenance set.
notes: >
