id: F3
title: CurationPolicy (KRS) is not enforced through evidence assembly
query_family: cross-route
execution_mode: deterministic
status: retired
status_history:
  - date: "2026-06-11"
    status: suspected
    evidence: "Umbrella plan §4, Arena consensus"
  - date: "2026-06-12"
    status: reproduced
    evidence: "backend/tests/test_failure_atlas_repro.py::test_f3_baseline_build_evidence_accepts_no_policy"
  - date: "2026-06-12"
    status: assigned
    evidence: "FAILURE_ATLAS.md §8 — route policy enforcement is Program 3 ContextService scope"
  - date: "2026-06-15"
    status: retired
    evidence: >
      Plan A v0.10.0 marked F3 retired on the strength of the build_evidence
      policy kwarg + orchestrator forwarding (plumbing only).
  - date: "2026-06-16"
    status: assigned
    evidence: >
      PR #31 review re-opened F3: the policy kwarg was plumbed but evidence
      assembly never filtered by it, so two workspaces with opposite scope still
      received identical packs. Re-assigned to the Plan A review-fix for the
      behavioral glob-scope filter.
  - date: "2026-06-16"
    status: retired
    evidence: >
      Plan A review-fix: glob-based source-scope filter implemented in
      build_evidence via CurationPolicy.allows_source (centralized in
      _apply_policy_scope on every route); behavioral oracle
      test_f3_oracle_build_evidence_filters_out_of_scope_sources asserts an
      excluded source is omitted from the pack and from every item's
      source_span_ids.
owner: unassigned
impact: >
  The workspace Knowledge Requirement Spec (curate.yml) is resolved by the
  orchestrator but cannot influence which evidence is assembled: KRS bias,
  source scoping, and exclusions are silently ignored on every route, so two
  workspaces with opposite curation policies receive identical evidence packs.
boundary:
  module: backend/src/curator/retrieval/evidence.py
  symbol: build_evidence
  detail: >
    QueryOrchestrator resolves CurationPolicy via _resolve_policy
    (orchestrator.py:80,124) but calls build_evidence(self.paths, request,
    route) (:84,:129). The build_evidence signature (evidence.py:144) accepts
    no policy parameter; no callee consults the policy.
fixture: backend/tests/test_failure_atlas_repro.py::test_f3_oracle_build_evidence_filters_out_of_scope_sources
commands:
  - uv run --directory backend pytest "tests/test_failure_atlas_repro.py::test_f3_oracle_build_evidence_filters_out_of_scope_sources" -q
oracles:
  deterministic: >
    Evidence assembly receives the resolved CurationPolicy on every route, and
    a policy change (e.g. KRS exclusion or boost) produces a measurably
    different evidence pack on a fixture corpus constructed to discriminate
    policies.
  semantic: null
before_state_evidence: >
  At baseline, inspect.signature(build_evidence) parameters are exactly
  (paths, request, route, *, limit) — no policy parameter exists anywhere in
  the evidence module.
observed_result: >
  Reproduced 2026-06-12 — signature check confirms no policy parameter;
  module source contains no CurationPolicy reference.
snapshot:
  git_sha: 8458f652d5481f377bd957ed1256240aaf470f54
  version: 0.5.6
  schema_version: 6
  scenario: complex_math_backprop
assignment:
  program: program-3
  gate: >
    Enforce KRS policy, source scope, truth/freshness rules, and explicit
    degradation on every route (umbrella P3.1).
resolution:
  version: "0.10.0"
  evidence: >
    Plan A review-fix (A2): build_evidence applies the workspace source-scope
    globs via CurationPolicy.allows_source. Single-source items (spans, search
    hits) are kept only when in scope; multi-source items (community reports,
    synthesis) are kept when any backing source is in scope and have their
    source_span_ids filtered to in-scope spans. Behavioral oracle
    test_f3_oracle_build_evidence_filters_out_of_scope_sources.
  after_state: >
    A strict CurationPolicy (source_exclude=['03_Notes/private/**']) on the global
    route omits the excluded source's report and its span from
    EvidencePack.source_span_ids and from every EvidenceItem.source_span_ids,
    while the in-scope source's evidence is retained.
notes: >
  Behavioral oracle: test_f3_oracle_build_evidence_filters_out_of_scope_sources.
  F3 was prematurely retired on plumbing alone in v0.10.0, re-opened by the PR #31
  review, and re-retired here with the behavioral glob-scope filter — the full
  re-open audit trail is preserved in status_history (retired → assigned → retired).
