owner: unassigned
impact: >
  The workspace Knowledge Requirement Spec (curate.yml) is resolved by the
  orchestrator but cannot influence which evidence is assembled: KRS bias,
  source scoping, and exclusions are silently ignored on every route, so two
  workspaces with opposite curation policies receive identical evidence packs.
boundary:
  module: backend/src/curator/retrieval/evidence.py
  symbol: build_evidence
  detail: >
    QueryOrchestrator resolves CurationPolicy via _resolve_policy
    (orchestrator.py:80,124) but calls build_evidence(self.paths, request,
    route) (:84,:129). The build_evidence signature (evidence.py:144) accepts
    no policy parameter; no callee consults the policy.
fixture: backend/tests/test_failure_atlas_repro.py::test_f3_oracle_build_evidence_receives_curation_policy
commands:
  - uv run --directory backend pytest "tests/test_failure_atlas_repro.py::test_f3_oracle_build_evidence_receives_curation_policy" -q
oracles:
  deterministic: >
    Evidence assembly receives the resolved CurationPolicy on every route, and
    a policy change (e.g. KRS exclusion or boost) produces a measurably
