resolution:
  version: "0.10.0"
  evidence: >
    feat(retrieval): Plan A P3 — _report_items() now scores reports by query-term overlap
    and caps at _MAX_GLOBAL_REPORTS=10 (§28.2). Baseline test retired; oracle promoted.
  after_state: >
    On a 30-report, two-topic corpus, orthogonal queries select differing report sets
    each bounded to ≤10 items; omitted counts recorded in pack.omitted_counts.
