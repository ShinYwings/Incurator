id: F4
title: Global evidence is query-independent; source-scoped evidence is unbounded
query_family: global
execution_mode: deterministic
status: retired
status_history:
  - date: "2026-06-11"
    status: suspected
    evidence: "Umbrella plan §4, Arena consensus"
  - date: "2026-06-12"
    status: reproduced
    evidence: "backend/tests/test_failure_atlas_repro.py::test_f4_baseline_global_evidence_query_independent_and_unbounded"
  - date: "2026-06-12"
