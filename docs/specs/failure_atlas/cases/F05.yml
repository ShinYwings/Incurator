owner: unassigned
impact: >
  Evidence beyond the character budget is dropped with no record: the consuming
  LLM and the trace both believe the full pack was used. Character counts are
  not token counts, so the effective budget varies arbitrarily by language and
  content. No reserved expansion budget, no explicit omission, no progressive
  disclosure.
boundary:
  module: backend/src/curator/retrieval/models.py
  symbol: EvidencePack.evidence_block
  detail: >
    evidence_block(max_chars=16000) (models.py:62-71) breaks out of the item
    loop when the next chunk would exceed max_chars and returns the joined
    prefix; dropped items leave no marker in the block, the pack, or the trace.
fixture: backend/tests/test_failure_atlas_repro.py::test_f5_oracle_evidence_block_reports_explicit_omissions
commands:
  - uv run --directory backend pytest "tests/test_failure_atlas_repro.py::test_f5_oracle_evidence_block_reports_explicit_omissions" -q
oracles:
  deterministic: >
    Context packing enforces an explicit model-aware token budget; items that
    do not fit are recorded as explicit omissions (in the block and/or the
    pack/trace) with expansion handles, never silently dropped.
  semantic: null
before_state_evidence: >
  At baseline, an EvidencePack with 20 items of ~1,000 chars each renders an
  evidence_block of <=16,000 chars containing only a prefix of the items; the
  block contains no omission marker and the pack records nothing about the
  dropped items.
observed_result: >
  Reproduced 2026-06-12 — 20-item pack rendered 15 items; 5 dropped silently;
  no omission marker present.
