owner: program-2
impact: >
  Homonyms from unrelated domains are silently merged into one entity (their
  span references unioned), poisoning every downstream relation, community,
  report, and synthesis that touches the entity. Conversely, aliases split
  into separate entities. Community detection is plain connected components,
  so any chain of weak relations collapses the graph into one giant
  community, making "community" reports corpus-wide mush.
boundary:
  module: backend/src/curator/db.py
  symbol: upsert_graph_entity
  detail: >
    Entities are deduplicated by exact (canonical_name, entity_type) string
    match (db.py:1553-1573) — no alias handling, no homonym protection.
    pipeline/graph_index.py:136 keys name_to_id on canonical_name alone.
    pipeline/community_reports.py:58-76 detects communities as connected
    components (union-find) over all relations regardless of weight or
    support.
