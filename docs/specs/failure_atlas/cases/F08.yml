  semantic: null
before_state_evidence: >
  At baseline, upserting "Transformer (electrical device)" and "Transformer
  (neural architecture)" with the same canonical_name and entity_type returns
  the same entity id with unioned spans; chaining 10 entities with one weak
  relation each yields exactly one detected community containing all 10.
observed_result: >
