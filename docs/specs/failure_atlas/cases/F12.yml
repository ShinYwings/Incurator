owner: program-3
impact: >
  Equivalent requests from an external agent (MCP) and the Obsidian plugin
  travel different code paths and return structurally different evidence:
  the MCP path returns an orchestrator pack with trace_id/source_span_ids,
  while the plugin path has its own persona-boost, fallback, and trace shape.
  Cross-client answer parity cannot be measured, and fixes to one surface
  silently miss the other.
boundary:
  module: backend/src/curator/plugin_api.py
  symbol: curator_query
  detail: >
    MCP curator_fetch_context / curator_query (mcp_server.py:3174-3207)
    delegate to QueryOrchestrator. plugin_api.curator_query
    (plugin_api.py:678-826) is an independent implementation with its own
    persona boost-term resolution, its own l3_incomplete fallback payload
    (fallback_hits + trace dict without QTR trace_id), and its own response
    schema. No shared normalized evidence-pack model exists.
fixture: backend/tests/test_failure_atlas_repro.py::test_f12_baseline_mcp_plugin_shapes_diverge
commands:
  - scripts/backend-check pytest "backend/tests/test_failure_atlas_repro.py::test_f12_baseline_mcp_plugin_shapes_diverge" -q
oracles:
  deterministic: >
    For an equivalent request, the backend evidence delivered to external MCP
    clients and to the Obsidian plugin normalizes to the same evidence-pack
    contract (same core fields: route, trace identity, evidence items with
    span provenance), with client-owned immediate viewer context explicitly
    separated and excluded from the parity comparison.
  semantic: null
before_state_evidence: >
  At baseline, for the same question on the same vault,
  QueryOrchestrator.fetch_context returns keys including route/trace_id/
  evidence/source_span_ids, while plugin_api.curator_query (provider-free
  fallback path) returns answer/fallback/fallback_hits/trace with no QTR
  trace_id and no source_span_ids — the shapes share almost no contract.
observed_result: >
  Reproduced 2026-06-12 — key-set comparison shows the plugin payload lacks
  trace_id-linked evidence and span provenance entirely; shared keys are
  insufficient to reconstruct equivalent evidence.
