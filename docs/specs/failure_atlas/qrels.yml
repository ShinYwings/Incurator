# Ground-truth relevance labels (qrels) over fixture_corpus.yml.
# See FAILURE_ATLAS.md and EVALUATION_BASELINE.md.
#
# Labeling method: deterministic expected-id labels authored together with the
# synthetic corpus (each query's vocabulary was written to have exactly one —
# or for associative queries, an enumerated set of — correct document[s]).
# Reviewer provenance: authored and cross-checked by the D1 agent against the
# corpus bodies on 2026-06-12; no model judge involved.
#
# Partition discipline (no-tuning rule):
# - dev:        may be inspected and re-run freely during development.
# - regression: frozen; run on every CI pass; thresholds are binding.
# - holdout:    frozen and NEVER measured during development/tuning. The eval
#               runner validates its structure but skips measurement until a
#               D2-approved evaluation procedure consumes it.
# - adversarial: hard-negative pairs; binding like regression.
