# [CRITICAL WARNING] DO NOT ADD LOCAL WORKSPACE FILES (e.g., 01_Workspaces/**, Papers/, *.md) TO sources.include.
# ALL sources MUST be relative to the global vault_root defined in AGENTS.md.
# curate.yml — Knowledge Requirement Specification
# Generated by: wiki workspace init
#
# The Curator reads this file to scope Exhibition staging for this workspace.
# search_curator MCP tool applies these filters automatically when
# WORKSPACE_PATH env var points to this directory.

project: "{{project_name}}"
description: "{{description}}"
vault_root: "{{vault_root}}"

persona:
  domain: ""
  subdomain: ""
  goal: ""
  exhibition_intent: "engineer"   # researcher | engineer | learner
  disambiguation_keywords: []
  confidence:                     # Override global thresholds for this workspace.
    high_threshold: 0.85          # Exhibitions above this → high confidence.
    low_threshold: 0.55           # Exhibitions below this → HITL review.
  updated_at: ""

# Source selection: which vault files to pull knowledge from.
# Patterns are fnmatch globs relative to the vault root.
# Empty include list = include all sources (no filter).
# This is the primary filter used by wiki curate --workspace to select Concepts.
sources:
  include: []
  #  - "03_Notes/**"
  #  - "02_Wiki/ml/**"
  exclude: []
  #  - "03_Notes/private/**"



# Minimum confidence_score for surfaced Exhibitions.
# Exhibitions below this threshold are excluded from search_curator results.
# Range: 0.0 – 1.0. Default: 0.60
min_confidence: 0.60

# Active workspace Exhibition (auto-set by wiki curate --workspace).
# The MCP uses this Exhibition as the primary conversation anchor.
# Edit only to pin a different Exhibition; leave empty to auto-detect.
exhibition: ""
