# curate.yml — Knowledge Requirement Specification
# Generated by: wiki workspace init
# Place at: 01_Workspaces/{Project_Name}/curate.yml
#
# The Curator reads this file to scope Exhibition staging for this workspace.
# search_curator MCP tool applies these filters automatically when
# WORKSPACE_PATH env var points to this directory.

project: "{{project_name}}"
description: "{{description}}"

# Source selection: which vault files to pull knowledge from.
# Patterns are fnmatch globs relative to the vault root.
# Empty include list = include all sources (no filter).
sources:
  include: []
  #  - "03_Notes/**"
  #  - "02_Wiki/ml/**"
  exclude: []
  #  - "03_Notes/private/**"

# Knowledge domains this workspace operates in.
# Narrows which Exhibitions are surfaced during search.
domains: []
#  - "machine-learning"
#  - "knowledge-management"

# Specific topic strings to boost during search.
# These are appended to search queries for relevance weighting.
topics: []
#  - "transformer architecture"
#  - "attention mechanism"

# Minimum confidence_score for surfaced Exhibitions.
# Exhibitions below this threshold are excluded from search_curator results.
# Range: 0.0 – 1.0. Default: 0.60
min_confidence: 0.60

# DAG layer scope for search_curator.
# Values: all | contexts | atoms | concepts | exhibitions
scope: "all"
