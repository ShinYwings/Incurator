# QMD configuration for the LLM-Wiki Curator
#
# Auto-generated by `wiki init`. Edit if you need to add ignore patterns or
# additional contexts. Do NOT change `path` — it must point at this project's
# `.curator/Collections/` directory.
#
# This file is loaded by qmd via the QMD_CONFIG_DIR environment variable that
# `wiki` sets to this project's `.curator/qmd/` directory before each call.

global_context: |
  Curator-generated DAG knowledge base. The path tells you which DAG layer the
  document lives in: 01_Summaries (L1, 1:1 source recap), 02_Atoms (L2,
  irreducible facts), 03_Concepts (L3, atom clusters), 04_Synthesis (L4,
  terminal cross-domain conclusions). Cite via [[LAYER/ID]] wikilinks. Prefer
  L2 atoms for factual claims; backtrack from higher layers if confidence_score
  is below 0.90.

collections:
  curator:
    path: __COLLECTIONS_PATH__
    pattern: "**/*.md"
    ignore:
      - "lint-report-*.md"
    context:
      "/01_Summaries": |
        L1 SUMMARY layer. Each page is a 1:1 hash-matched recap of one source
        document under 02_Wiki / 03_Notes / 04_Resources / 06_Archives. Frontmatter
        carries `id: SUM-…`, `source_path`, `source_hash`, `domain`. Body sections:
        ## Summary, ## Key Claims, ## Atom Candidates, ## Source.
      "/02_Atoms": |
        L2 ATOM layer. Irreducible factual claims, equations, or theoretical
        constraints distilled from one or more L1 summaries. Frontmatter:
        `id: ATM-…`, `parent_source: [[01_Summaries/SUM-…]]`, `claim_type`,
        `contradicts`, `is_verified_by_human`, `is_flagged_for_agent`.
        Body: ## Definition / Claim, ## Context, ## Constraints, ## Relations.
      "/03_Concepts": |
        L3 CONCEPT layer. Clusters of related L2 atoms forming a coherent
        conceptual unit. Frontmatter: `id: CON-…`, `dependencies: [[02_Atoms/…]]`,
        `domain`. Body: ## Core Logic, ## Constituent Facts, ## Implications,
        ## Open Questions. Minimum 2 atom dependencies; never singletons.
      "/04_Synthesis": |
        L4 SYNTHESIS layer. Terminal cross-domain knowledge outputs combining
        multiple L3 concepts. Frontmatter: `id: SYN-…`, `core_concepts: [[03_Concepts/…]]`,
        `confidence_score` (0.00-1.00), `requires_math_rigor`. Body:
        ## Synthesis Statement, ## Evidence Chain, ## Confidence Justification,
        ## Mathematical Formulation (when math), ## Contradictions / Open Issues.
        Use confidence_score to decide retrieval strategy: >=0.90 direct cite,
        0.60-0.90 backtrack to L2, <0.60 halt for human verification.
      "/": "Curator DAG knowledge base."
